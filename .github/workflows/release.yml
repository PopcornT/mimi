name: Publish Mimi to npm
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-mimi
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: npm ci
      - name: Publish using npm trusted publishing
        run: npm publish --workspace packages/docs --access public --provenance
      - name: Verify anonymous registry installation
        run: node scripts/verify-registry.mjs
